<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Offline | QuantiDawn Estimator</title>
<link rel="icon" href="/brand/favicon-32.png"><link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#f6f6f7;--ink:#18181b;--ink-2:#52525b;--accent:#c2410c;--on:#fff;--line:#e4e4e7}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f11;--ink:#f4f4f5;--ink-2:#a1a1aa;--accent:#ef6a35;--on:#1a0f0a;--line:#2a2a30}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.55 'Geist',system-ui,sans-serif;padding:24px}
main{max-width:420px}img{width:min(220px,60vw);height:auto;display:block;margin-bottom:28px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 8px}p{color:var(--ink-2);margin:0 0 20px}
button{font:500 14px inherit;font-family:inherit;padding:10px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
</style></head><body><main>
<picture><source media="(prefers-color-scheme: dark)" srcset="/brand/logo-white.png"><img src="/brand/logo-full.png" alt="QuantiDawn" width="220" height="49"></picture>
<h1>You are offline</h1>
<p>The estimator needs a connection to open plans and projects. Your saved work is safe on the server. Reconnect and try again.</p>
<button onclick="location.reload()">Try again</button>
</main></body></html>
