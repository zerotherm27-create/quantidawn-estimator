<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{TITLE}}</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<meta name="description" content="A file prepared for you by QuantiDawn is ready to download. No account needed.">
<meta property="og:type" content="website"><meta property="og:site_name" content="QuantiDawn">
<meta property="og:title" content="QuantiDawn | Your file is ready"><meta property="og:description" content="A file prepared for you by QuantiDawn is ready to download. No account needed.">
<meta property="og:url" content="https://estimate.quantidawn.com/"><meta property="og:image" content="https://estimate.quantidawn.com/brand/og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="QuantiDawn - construction estimating">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="QuantiDawn | Your file is ready"><meta name="twitter:description" content="A file prepared for you by QuantiDawn is ready to download. No account needed."><meta name="twitter:image" content="https://estimate.quantidawn.com/brand/og-image.png">
<meta name="theme-color" content="#c2410c"><link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="/brand/favicon-512.png">
<link rel="icon" href="/brand/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<style>:root{color-scheme:light;--bg:#f6f6f7;--surface:#fff;--ink:#18181b;--ink-2:#52525b;--ink-3:#6b6b74;--line:#e4e4e7;--accent:#c2410c;--accent-soft:#fbece5;--on-accent:#fff;--font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f0f11;--surface:#16161a;--ink:#f4f4f5;--ink-2:#a1a1aa;--ink-3:#8d8d96;--line:#2a2a30;--accent:#ef6a35;--accent-soft:#2a1710;--on-accent:#1a0f0a}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;font:500 14px var(--font);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;text-decoration:none;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px) scale(.98)}

main{min-height:100dvh;display:grid;align-content:center;justify-items:start;width:min(560px,calc(100% - 48px));margin:0 auto;padding:48px 0;gap:20px}
.logo img{display:block;width:min(300px,75vw);height:auto}
h1{font-size:28px;letter-spacing:-.03em;line-height:1.1}
.file{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 20px;display:grid;gap:4px}
.file b{font-weight:600;word-break:break-all}.file span{color:var(--ink-2);font-size:13px}
.num{font-family:var(--mono)}
p{color:var(--ink-2)}
.gone h1{font-size:24px}
</style></head><body>
<main class="{{STATE}}">
  <picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="/brand/logo-white.png"><img src="/brand/logo-full.png" alt="QuantiDawn - construction estimating" width="280" height="62"></picture>
  <h1>{{TITLE}}</h1>
  <div class="msg">{{MSG}}</div>
  <div class="file" id="f" data-state="{{STATE}}"><b>{{FILE}}</b><span class="num">{{SIZE}}</span><span>Available until {{EXPIRES}}</span></div>
  <a class="btn" id="dl" href="{{URL}}" download>Download the workbook</a>
  <p style="font-size:13px">Prepared by QuantiDawn. Excel workbook (.xlsx). Keep this link private: anyone who has it can download the file.</p>
</main>
<script>if(document.getElementById('f').dataset.state==='gone'){document.getElementById('f').remove();document.getElementById('dl').remove();document.querySelector('main p').remove()}</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
</body></html>
